name: Build Windows exe

# Manual build of the standalone Windows executable. Mirrors the
# windows-release-runtime job in ci.yml and uploads the result as an artifact;
# it does not create a tag or a GitHub Release.
on:
  workflow_dispatch:
  push:
    branches:
      - "build/windows-exe"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exact release Python and SQLite
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniconda-version: "py311_26.5.3-2"
          activate-environment: chatlog-release-windows
          environment-file: packaging/windows-release-environment.yml
          auto-activate: false
          channels: defaults
          channel-priority: strict
      - name: Verify exact runtime and shifted pending-byte gate
        shell: pwsh
        run: |
          python -c "import os, platform, sqlite3, sys; assert sys.version_info[:3] == (3, 11, 15); assert sqlite3.sqlite_version == '3.53.2'; assert sys.prefix == sys.base_prefix; assert os.path.samefile(os.path.dirname(sys.executable), os.environ['CONDA_PREFIX']); assert os.path.isdir(os.path.join(sys.prefix, 'Library', 'bin')); assert os.environ.get('CONDA_DEFAULT_ENV') == 'chatlog-release-windows'; assert platform.machine().lower() in {'amd64', 'x86_64'}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I chatlog_keeper/_qq_sqlite_helper.py --runtime-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r packaging/release-requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test
        shell: pwsh
        run: python -m pytest -q
      - name: Build standalone executable
        shell: pwsh
        run: python -m PyInstaller packaging/chatlog_keeper.spec --noconfirm --clean --distpath dist_exe
      - name: Verify standalone executable outside the build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $executable = (Resolve-Path -LiteralPath .\dist_exe\chatlog-keeper.exe).Path
          $standaloneWorkdir = Join-Path $env:RUNNER_TEMP ("chatlog-keeper-smoke-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $standaloneWorkdir | Out-Null
          $originalPath = $env:PATH
          Push-Location $standaloneWorkdir
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
            & $executable --help
            if ($LASTEXITCODE -ne 0) { throw "standalone help probe failed" }
            & $executable --_qq-sqlite-helper --runtime-probe
            if ($LASTEXITCODE -ne 0) { throw "standalone SQLite probe failed" }
            & $executable message-stream-v1 --capabilities
            if ($LASTEXITCODE -ne 0) { throw "standalone message-stream capability failed" }
            & $executable participant-directory-v1 --capabilities
            if ($LASTEXITCODE -ne 0) { throw "standalone participant-directory capability failed" }
            & $executable key-identity-v1 --capabilities
            if ($LASTEXITCODE -ne 0) { throw "standalone key-identity capability failed" }
            & $executable native-account-binding-v1 --capabilities
            if ($LASTEXITCODE -ne 0) { throw "standalone native-account-binding capability failed" }
            & $executable probe
            if ($LASTEXITCODE -ne 0) { throw "standalone connector probe failed" }
          } finally {
            $env:PATH = $originalPath
            Pop-Location
          }
      - name: Validate protocols and checksum executable
        shell: pwsh
        run: |
          python packaging/release_metadata.py validate-capabilities `
            --executable .\dist_exe\chatlog-keeper.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/release_metadata.py checksum `
            --file .\dist_exe\chatlog-keeper.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chatlog-keeper-windows-x86_64
          path: |
            dist_exe/chatlog-keeper.exe
            dist_exe/chatlog-keeper.exe.sha256
          if-no-files-found: error
